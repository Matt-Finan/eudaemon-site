<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" font-family="Newsreader, Georgia, 'Times New Roman', serif" role="img" aria-label="Four lives, one question: does the coffee vary, and for whose reasons? A clockwork life has coffee every day at 16:00: nothing ever differs, nothing to compare. An entangled life has coffee only during overtime: comparisons exist, every one loaded the same way. A scrambled life, shifts and time zones and meals where they land, has coffee varying across many contexts: coffee's impact on sleep begins to separate from overtime's. The coin takes the entangled life and assigns the coffee by chance: the coin ignores the overtime, so any sleep gap is down to the coffee. A key shows the cup, the overtime shading and the coin.">
  <style>
    .ink{stroke:#131C2E;fill:none;stroke-width:1.6}
    .hair{stroke:#131C2E;fill:none;stroke-width:1.2}
    .dash{stroke:#131C2E;fill:none;stroke-width:1.2;stroke-dasharray:3 4}
    .box{fill:#EDE6D6;stroke:#131C2E;stroke-width:1.5}
    .work{fill:#D5CAAE;stroke:none}
    .tink{fill:#131C2E;stroke:none}
    .bar{fill:#131C2E;stroke:none}
    .soft{fill:#4A5164;stroke:none}
    .meta{fill:#6B6450;stroke:none}
    .eno{fill:#7E6015;stroke:none}
    .gold{fill:#C99B3F;stroke:#131C2E;stroke-width:0.9}
    .garr{stroke:#C99B3F;fill:none;stroke-width:2}
    .coin{stroke:#7E6015;fill:none;stroke-width:1.6}
    .cointxt{fill:#7E6015;stroke:none}
    .ahf{fill:#131C2E;stroke:none}
    .gahf{fill:#C99B3F;stroke:none}
    @media (prefers-color-scheme: dark){
      .ink,.hair,.dash{stroke:#E8E1D2}
      .box{fill:#172138;stroke:#E8E1D2}
      .work{fill:#39466B}
      .tink{fill:#E8E1D2}
      .bar{fill:#E8E1D2}
      .soft{fill:#B8B2A2}
      .meta{fill:#8B8676}
      .eno{fill:#D9A441}
      .gold{fill:#D9A441;stroke:#0F1626}
      .garr{stroke:#D9A441}
      .coin{stroke:#D9A441}
      .cointxt{fill:#D9A441}
      .ahf{fill:#E8E1D2}
      .gahf{fill:#D9A441}
    }
  </style>
  <defs>
    <g id="cup">
      <rect x="-6" y="-4" width="11.5" height="8" rx="1.8" class="gold"/>
      <path d="M 6 -1.8 a 2.6 2.6 0 1 1 0 4.6" class="coin"/>
    </g>
  </defs>
  <text x="420" y="24" text-anchor="middle" font-size="9.5" letter-spacing="1.5" class="eno">FOUR LIVES, ONE QUESTION</text>
  <text x="420" y="45" text-anchor="middle" font-size="13.5" font-weight="500" class="tink">Does the coffee vary, and for whose reasons?</text>

  <!-- row 1 · clockwork -->
  <text x="24" y="86" font-size="10" letter-spacing="1.2" class="eno">CLOCKWORK</text>
  <text x="24" y="100" font-size="9.5" class="soft">coffee at 16:00, every day</text>
  <line x1="200" y1="114" x2="656" y2="114" class="hair"/>
  <use href="#cup" x="219" y="96"/><use href="#cup" x="257" y="96"/><use href="#cup" x="295" y="96"/><use href="#cup" x="333" y="96"/><use href="#cup" x="371" y="96"/><use href="#cup" x="409" y="96"/><use href="#cup" x="447" y="96"/><use href="#cup" x="485" y="96"/><use href="#cup" x="523" y="96"/><use href="#cup" x="561" y="96"/><use href="#cup" x="599" y="96"/><use href="#cup" x="637" y="96"/>
  <text x="668" y="92" font-size="10" class="soft">nothing ever differs;</text>
  <text x="668" y="106" font-size="10" class="soft">nothing to compare</text>

  <!-- row 2 · entangled -->
  <text x="24" y="156" font-size="10" letter-spacing="1.2" class="eno">ENTANGLED</text>
  <text x="24" y="170" font-size="9.5" class="soft">the coffee rides</text>
  <text x="24" y="182" font-size="9.5" class="soft">the overtime</text>
  <rect x="348" y="146" width="198" height="38" rx="5" class="work"/>
  <line x1="200" y1="184" x2="656" y2="184" class="hair"/>
  <use href="#cup" x="371" y="166"/><use href="#cup" x="409" y="166"/><use href="#cup" x="447" y="166"/><use href="#cup" x="485" y="166"/><use href="#cup" x="523" y="166"/>
  <text x="668" y="162" font-size="10" class="soft">comparisons exist, every</text>
  <text x="668" y="176" font-size="10" class="soft">one loaded the same way</text>

  <!-- row 3 · scrambled -->
  <text x="24" y="226" font-size="10" letter-spacing="1.2" class="eno">SCRAMBLED</text>
  <text x="24" y="240" font-size="9.5" class="soft">shifts, time zones, meals</text>
  <text x="24" y="252" font-size="9.5" class="soft">where they land</text>
  <rect x="234" y="216" width="84" height="38" rx="5" class="work"/>
  <rect x="424" y="216" width="46" height="38" rx="5" class="work"/>
  <rect x="538" y="216" width="84" height="38" rx="5" class="work"/>
  <line x1="200" y1="254" x2="656" y2="254" class="hair"/>
  <use href="#cup" x="219" y="236"/><use href="#cup" x="295" y="236"/><use href="#cup" x="409" y="236"/><use href="#cup" x="485" y="236"/><use href="#cup" x="599" y="236"/>
  <text x="668" y="230" font-size="10" class="soft">coffee's impact on sleep</text>
  <text x="668" y="244" font-size="10" class="soft">begins to separate</text>
  <text x="668" y="258" font-size="10" class="soft">from overtime's</text>

  <!-- row 4 · the coin -->
  <text x="24" y="296" font-size="10" letter-spacing="1.2" class="eno">THE COIN</text>
  <text x="24" y="310" font-size="9.5" class="soft">the entangled life, coffee</text>
  <text x="24" y="322" font-size="9.5" class="soft">assigned by chance</text>
  <circle cx="176" cy="306" r="8" class="coin"/>
  <text x="176" y="309.5" text-anchor="middle" font-size="10" font-weight="500" class="cointxt">?</text>
  <rect x="348" y="286" width="198" height="38" rx="5" class="work"/>
  <line x1="200" y1="324" x2="656" y2="324" class="hair"/>
  <use href="#cup" x="257" y="306"/><use href="#cup" x="371" y="306"/><use href="#cup" x="447" y="306"/><use href="#cup" x="561" y="306"/><use href="#cup" x="637" y="306"/>
  <text x="668" y="296" font-size="10" class="soft">the coin ignores the</text>
  <text x="668" y="310" font-size="10" class="soft">overtime, so any sleep gap</text>
  <text x="668" y="324" font-size="10" class="soft">is down to the coffee</text>

  <use href="#cup" x="182" y="352"/>
  <text x="196" y="356" font-size="10" class="soft">coffee after 16:00</text>
  <rect x="322" y="345" width="16" height="13" rx="2.5" class="work"/>
  <text x="346" y="356" font-size="10" class="soft">overtime at work</text>
  <circle cx="478" cy="351" r="7" class="coin"/>
  <text x="478" y="354.5" text-anchor="middle" font-size="8.5" font-weight="500" class="cointxt">?</text>
  <text x="492" y="356" font-size="10" class="soft">the coin decides the coffee</text>
</svg>
