<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 494" font-family="Newsreader, Georgia, 'Times New Roman', serif" role="img" aria-label="The second test: how long does beta stay where the record put it? Three panels, each beta, the link between coffee and bedtime, over years of record, with the give or take band set in advance, a ribbon showing how sure the record is that narrows until it fits inside the band, and a gold dot where beta is pinned. The bracket over the pin is clock 1, the time to pin down; the bracket after it is clock 2, the time beta stays put. Ratio above 1: pinned quickly, then beta stays inside the band for a long stretch and only late does it leave; the answer arrives while it is still true. Ratio below 1: beta is drifting from the start, takes longer to pin, and leaves the band soon after; it moves faster than it can be pinned. Undetermined: pinned late, and still inside the band when the record ends, so clock 2 is at least that long but not yet longer than clock 1.">
