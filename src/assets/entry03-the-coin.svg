<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 384" font-family="Newsreader, Georgia, 'Times New Roman', serif" role="img" aria-label="The coin: a coin sits above every column, including tomorrow's, with an arrow down to the cup it placed; the cups fall on 2 levels, early or late. The bedtime still runs late after the late coffees. Tomorrow's coffee is already placed, since the coin has tossed, and only tomorrow's bedtime is dashed, its bracket labelled b3 = beta times c3. In the panel what moves what, the coin's arrow is the only one into coffee, coffee's arrow runs to sleep, and the third thing is dashed with its links cut; caption, the coin moves the coffee; the coffee moves sleep; nothing else had a say.">
  <style>
    .ink{stroke:#131C2E;fill:none;stroke-width:1.6}
    .hair{stroke:#131C2E;fill:none;stroke-width:1.2}
    .dash{stroke:#131C2E;fill:none;stroke-width:1.2;stroke-dasharray:3 4}
    .box{fill:#EDE6D6;stroke:#131C2E;stroke-width:1.5}
    .work{fill:#D5CAAE;stroke:none}
    .tink{fill:#131C2E;stroke:none}
    .bar{fill:#131C2E;stroke:none}
    .soft{fill:#4A5164;stroke:none}
    .meta{fill:#6B6450;stroke:none}
    .eno{fill:#7E6015;stroke:none}
    .gold{fill:#C99B3F;stroke:#131C2E;stroke-width:0.9}
    .garr{stroke:#C99B3F;fill:none;stroke-width:2}
    .coin{stroke:#7E6015;fill:none;stroke-width:1.6}
    .cointxt{fill:#7E6015;stroke:none}
    .ahf{fill:#131C2E;stroke:none}
    .gahf{fill:#C99B3F;stroke:none}
    .ribbon{fill:#131C2E;fill-opacity:0.13;stroke:none}
    .gdot{fill:#C99B3F;stroke:#131C2E;stroke-width:1.2}
    @media (prefers-color-scheme: dark){
      .ink,.hair,.dash{stroke:#E8E1D2}
      .box{fill:#172138;stroke:#E8E1D2}
      .work{fill:#283352}
      .tink{fill:#E8E1D2}
      .bar{fill:#E8E1D2}
      .soft{fill:#B8B2A2}
      .meta{fill:#8B8676}
      .eno{fill:#D9A441}
      .gold{fill:#D9A441;stroke:#0F1626}
      .garr{stroke:#D9A441}
      .coin{stroke:#D9A441}
      .cointxt{fill:#D9A441}
      .ahf{fill:#E8E1D2}
      .gahf{fill:#D9A441}
      .ribbon{fill:#E8E1D2;fill-opacity:0.16}
      .gdot{fill:#D9A441;stroke:#0F1626}
    }
  </style>
  <defs>
    <g id="cup">
      <rect x="-7" y="-4.5" width="13" height="9" rx="2" class="gold"/>
      <path d="M 6.5 -2 a 3 3 0 1 1 0 5" class="coin"/>
    </g>
    <marker id="ah7" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0.8 0.9 L 8.8 5 L 0.8 9.1 Z" class="ahf"/>
    </marker>
  </defs>
  <text x="420" y="24" text-anchor="middle" font-size="9.5" class="eno" letter-spacing="1.5">THE COIN</text>
  <text x="420" y="45" text-anchor="middle" font-size="13.5" class="tink" font-weight="500">When the coin chooses the coffee, does the bedtime still follow?</text>
  <text x="88" y="94" text-anchor="end" font-size="10" class="soft">time of day</text>
  <line x1="96" y1="90" x2="96" y2="326.0" class="hair" marker-end="url(#ah7)"/>
  <line x1="96" y1="320.5" x2="596" y2="320.5" class="hair"/>
  <line x1="92" y1="120.0" x2="96" y2="120.0" class="hair"/>
  <text x="86" y="123.5" text-anchor="end" font-size="9" class="meta">16:00</text>
  <line x1="92" y1="200.0" x2="96" y2="200.0" class="hair"/>
  <text x="86" y="203.5" text-anchor="end" font-size="9" class="meta">20:00</text>
  <line x1="92" y1="280.0" x2="96" y2="280.0" class="hair"/>
  <text x="86" y="283.5" text-anchor="end" font-size="9" class="meta">00:00</text>
  <text x="380" y="335.0" text-anchor="middle" font-size="9.5" class="meta">yesterday</text>
  <text x="446" y="335.0" text-anchor="middle" font-size="9.5" class="meta">today</text>
  <text x="512" y="335.0" text-anchor="middle" font-size="9.5" class="meta">tomorrow</text>
  <line x1="100" y1="138.0" x2="596" y2="138.0" class="dash"/>
  <text x="600" y="133.5" font-size="9" class="meta">average coffee</text>
  <circle cx="116" cy="84" r="7" class="coin"/>
  <text x="116" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="116" y1="93" x2="116" y2="157.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="116" y="165.0"/>
  <circle cx="182" cy="84" r="7" class="coin"/>
  <text x="182" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="182" y1="93" x2="182" y2="102.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="182" y="110.0"/>
  <circle cx="248" cy="84" r="7" class="coin"/>
  <text x="248" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="248" y1="93" x2="248" y2="157.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="248" y="165.0"/>
  <circle cx="314" cy="84" r="7" class="coin"/>
  <text x="314" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="314" y1="93" x2="314" y2="102.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="314" y="110.0"/>
  <circle cx="380" cy="84" r="7" class="coin"/>
  <text x="380" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="380" y1="93" x2="380" y2="102.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="380" y="110.0"/>
  <circle cx="446" cy="84" r="7" class="coin"/>
  <text x="446" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="446" y1="93" x2="446" y2="157.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="446" y="165.0"/>
  <circle cx="512" cy="84" r="7" class="coin"/>
  <text x="512" y="87" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <line x1="512" y1="93" x2="512" y2="157.0" class="hair" marker-end="url(#ah7)"/>
  <use href="#cup" x="512" y="165.0"/>
  <path d="M 394 137.5 L 402 137.5 M 398 137.5 L 398 110.0 M 394 110.0 L 402 110.0" class="hair"/>
  <text x="406" y="108.0" font-size="10" class="tink">c₁</text>
  <path d="M 460 137.5 L 468 137.5 M 464 137.5 L 464 165.0 M 460 165.0 L 468 165.0" class="hair"/>
  <text x="472" y="168.5" font-size="10" class="tink">c₂</text>
  <path d="M 526 137.5 L 534 137.5 M 530 137.5 L 530 165.0 M 526 165.0 L 534 165.0" class="hair"/>
  <text x="538" y="168.5" font-size="10" class="tink">c₃</text>
  <g class="bar">
    <rect x="103.0" y="281.7" width="26" height="38.3" rx="2"/>
    <rect x="169.0" y="245.0" width="26" height="75.0" rx="2"/>
    <rect x="235.0" y="285.0" width="26" height="35.0" rx="2"/>
    <rect x="301.0" y="246.7" width="26" height="73.3" rx="2"/>
    <rect x="367.0" y="241.7" width="26" height="78.3" rx="2"/>
    <rect x="433.0" y="278.3" width="26" height="41.7" rx="2"/>
  </g>
  <rect x="499.0" y="281.5" width="26" height="38.5" rx="2" class="dash"/>
  <line x1="100" y1="263.6" x2="596" y2="263.6" class="dash"/>
  <text x="600" y="259.0555555555556" font-size="9" class="meta">average bedtime</text>
  <path d="M 397.0 263.1 L 405.0 263.1 M 401.0 263.1 L 401.0 241.7 M 397.0 241.7 L 405.0 241.7" class="hair"/>
  <text x="409.0" y="239.66666666666663" font-size="10" class="tink">b₁</text>
  <path d="M 463.0 263.1 L 471.0 263.1 M 467.0 263.1 L 467.0 278.3 M 463.0 278.3 L 471.0 278.3" class="hair"/>
  <text x="475.0" y="281.83333333333337" font-size="10" class="tink">b₂</text>
  <path d="M 529.0 263.1 L 537.0 263.1 M 533.0 263.1 L 533.0 281.5 M 529.0 281.5 L 537.0 281.5" class="hair"/>
  <text x="541.0" y="284.9805555555556" font-size="10" class="tink">b₃ = β × c₃</text>
  <line x1="676" y1="90" x2="676" y2="326.0" class="hair" opacity="0.5"/>
  <text x="758.0" y="94" text-anchor="middle" font-size="8.5" class="eno" letter-spacing="1.2">WHAT MOVES WHAT</text>
  <circle cx="746" cy="216.0" r="16" class="box"/>
  <text x="746" y="219.5" text-anchor="middle" font-size="9" class="tink">coffee</text>
  <circle cx="810" cy="216.0" r="16" class="box"/>
  <text x="810" y="219.5" text-anchor="middle" font-size="9" class="tink">sleep</text>
  <circle cx="778" cy="166.0" r="13" class="box" stroke-dasharray="3 3"/>
  <text x="778" y="169.5" text-anchor="middle" font-size="9" class="meta">?</text>
  <line x1="770" y1="176.0" x2="756" y2="203.0" class="dash"/>
  <line x1="786" y1="176.0" x2="800" y2="203.0" class="dash"/>
  <circle cx="704" cy="216.0" r="9" class="coin"/>
  <text x="704" y="219.5" text-anchor="middle" font-size="10" class="cointxt" font-weight="500">?</text>
  <line x1="715" y1="216.0" x2="727" y2="216.0" class="ink" marker-end="url(#ah7)"/>
  <line x1="765" y1="216.0" x2="791" y2="216.0" class="ink" marker-end="url(#ah7)"/>
  <text x="758.0" y="250.0" text-anchor="middle" font-size="9" class="meta">the coin moves the coffee;</text>
  <text x="758.0" y="263.0" text-anchor="middle" font-size="9" class="meta">the coffee moves sleep;</text>
  <text x="758.0" y="276.0" text-anchor="middle" font-size="9" class="meta">nothing else had a say</text>
  <circle cx="111" cy="364" r="7" class="coin"/>
  <text x="111" y="367.5" text-anchor="middle" font-size="8.5" class="cointxt" font-weight="500">?</text>
  <text x="124" y="368" font-size="10" class="soft">the coin, tossed each afternoon</text>
  <use href="#cup" x="290.70000000000005" y="364"/>
  <text x="303.70000000000005" y="368" font-size="10" class="soft">coffee, where the coin put it</text>
  <rect x="454.00000000000006" y="356" width="8" height="14" rx="1.5" class="bar"/>
  <text x="470.00000000000006" y="368" font-size="10" class="soft">the night, from bedtime</text>
  <line x1="592.1" y1="364" x2="618.1" y2="364" class="dash"/>
  <text x="624.1" y="368" font-size="10" class="soft">the average of each</text>
  <rect x="727.4" y="356" width="8" height="14" rx="1.5" class="dash"/>
  <text x="743.4" y="368" font-size="10" class="soft">tomorrow's bedtime</text>

</svg>
