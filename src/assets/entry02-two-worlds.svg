<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" font-family="Newsreader, Georgia, 'Times New Roman', serif" role="img" aria-label="Two worlds. In world A, late coffee causes poor sleep. In world B, overtime drives both the late coffee and the poor sleep, and there is no arrow from coffee to sleep. In world A dropping the coffee buys back sleep; in world B it buys nothing.">
  <style>
    .ink{stroke:#131C2E;fill:none;stroke-width:1.6}
    .hair{stroke:#131C2E;fill:none;stroke-width:1.2}
    .dash{stroke:#131C2E;fill:none;stroke-width:1.2;stroke-dasharray:3 4}
    .box{fill:#EDE6D6;stroke:#131C2E;stroke-width:1.5}
    .work{fill:#D5CAAE;stroke:none}
    .tink{fill:#131C2E;stroke:none}
    .bar{fill:#131C2E;stroke:none}
    .soft{fill:#4A5164;stroke:none}
    .meta{fill:#6B6450;stroke:none}
    .eno{fill:#7E6015;stroke:none}
    .gold{fill:#C99B3F;stroke:#131C2E;stroke-width:0.9}
    .garr{stroke:#C99B3F;fill:none;stroke-width:2}
    .coin{stroke:#7E6015;fill:none;stroke-width:1.6}
    .cointxt{fill:#7E6015;stroke:none}
    .ahf{fill:#131C2E;stroke:none}
    .gahf{fill:#C99B3F;stroke:none}
    @media (prefers-color-scheme: dark){
      .ink,.hair,.dash{stroke:#E8E1D2}
      .box{fill:#172138;stroke:#E8E1D2}
      .work{fill:#283352}
      .tink{fill:#E8E1D2}
      .bar{fill:#E8E1D2}
      .soft{fill:#B8B2A2}
      .meta{fill:#8B8676}
      .eno{fill:#D9A441}
      .gold{fill:#D9A441;stroke:#0F1626}
      .garr{stroke:#D9A441}
      .coin{stroke:#D9A441}
      .cointxt{fill:#D9A441}
      .ahf{fill:#E8E1D2}
      .gahf{fill:#D9A441}
    }
  </style>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0.8 0.9 L 8.8 5 L 0.8 9.1 Z" class="ahf"/>
    </marker>
  </defs>
  <text x="420" y="28" text-anchor="middle" font-size="13.5" font-weight="500" class="tink">Correlation is the pattern; causation is which arrows are real</text>

  <text x="250" y="56" text-anchor="middle" font-size="9" letter-spacing="1.5" class="eno">WORLD A</text>
  <rect x="105" y="66" width="110" height="30" rx="6" class="box"/>
  <text x="160" y="85.5" text-anchor="middle" font-size="12" class="tink">late coffee</text>
  <line x1="217" y1="81" x2="281" y2="81" class="ink" marker-end="url(#ah4)"/>
  <rect x="285" y="66" width="110" height="30" rx="6" class="box"/>
  <text x="340" y="85.5" text-anchor="middle" font-size="12" class="tink">poor sleep</text>
  <text x="250" y="124" text-anchor="middle" font-size="11" class="soft">the coffee does it</text>

  <text x="590" y="56" text-anchor="middle" font-size="9" letter-spacing="1.5" class="eno">WORLD B</text>
  <rect x="538" y="62" width="104" height="28" rx="6" class="box"/>
  <text x="590" y="80.5" text-anchor="middle" font-size="12" class="tink">overtime</text>
  <line x1="566" y1="90" x2="522" y2="102" class="ink" marker-end="url(#ah4)"/>
  <line x1="614" y1="90" x2="658" y2="102" class="ink" marker-end="url(#ah4)"/>
  <rect x="455" y="104" width="110" height="30" rx="6" class="box"/>
  <text x="510" y="123.5" text-anchor="middle" font-size="12" class="tink">late coffee</text>
  <rect x="615" y="104" width="110" height="30" rx="6" class="box"/>
  <text x="670" y="123.5" text-anchor="middle" font-size="12" class="tink">poor sleep</text>
  <text x="590" y="154" text-anchor="middle" font-size="11" class="soft">the overtime drives both</text>

  <text x="420" y="184" text-anchor="middle" font-size="12" font-weight="500" class="tink">in World A, dropping the coffee buys back sleep; in World B it buys nothing</text>
</svg>
