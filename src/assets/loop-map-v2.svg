<rect x="758.5" y="420" width="220" height="90" rx="10" class="cardf"/>
<text x="868.5" y="457" font-size="15.5" class="ink" text-anchor="middle" letter-spacing="1.2">THE DEEP TWIN</text>
<text x="868.5" y="483" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">what I actually do, and why</text>
<rect x="758.5" y="730" width="220" height="90" rx="10" class="cardf"/>
<text x="868.5" y="761" font-size="15.5" class="ink" text-anchor="middle" letter-spacing="1.2">TELOS</text>
<text x="868.5" y="784" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">researches and turns my goals</text>
<text x="868.5" y="801" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">into a method optimised for me</text>
<rect x="490" y="885" width="220" height="90" rx="10" class="cardf"/>
<text x="600" y="922" font-size="15.5" class="ink" text-anchor="middle" letter-spacing="1.2">THE LOOP</text>
<text x="600" y="948" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">the plan, run day by day</text>
<rect x="221.5" y="730" width="220" height="90" rx="10" class="cardf"/>
<text x="331.5" y="767" font-size="15.5" class="ink" text-anchor="middle" letter-spacing="1.2">JARVIS</text>
<text x="331.5" y="793" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">the schlep, handed to software</text>
<rect x="221.5" y="420" width="220" height="90" rx="10" class="cardf"/>
<text x="331.5" y="457" font-size="13.8" class="ink" text-anchor="middle" letter-spacing="0.6">THE EXPERIMENT ENGINE</text>
<text x="331.5" y="483" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">where the record can't answer</text>
<path d="M 712.6 331.2 A 310 310 0 0 1 835 417.8" class="flow" stroke-width="2.0" marker-end="url(#ah)"/>
<path d="M 890.6 511.9 A 310 310 0 0 1 890.9 727" class="flow" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="800.7" y="333.3" font-size="13" class="soft" text-anchor="middle" font-style="italic">the record teaches it</text>
<text x="922" y="624" font-size="13" class="soft" text-anchor="start" font-style="italic">what's true of me, and why</text>
<path d="M 680.8 654 L 807.3 727" class="flow" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="716" y="664" font-size="13" class="soft" text-anchor="start" font-style="italic">a goal I bring</text>
<path d="M 767.7 729.5 L 669 672.5" class="flow" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="632" y="742" font-size="12.5" class="soft" text-anchor="start" font-style="italic">the method,</text>
<text x="632" y="760" font-size="12.5" class="soft" text-anchor="start" font-style="italic">and what it'd take</text>
<path d="M 600 705 L 600 881" class="flow" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="612" y="832" font-size="13" class="soft" text-anchor="start" font-style="italic">I commit</text>
<path d="M 523.8 576 L 414.7 513" class="flowd" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="447" y="578" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">or trial it small first</text>
<path d="M 562 700 C 552 712 541 722 528 731" class="flowd" stroke-width="1.8"/>
<circle cx="521" cy="737" r="5.5" class="rulec" stroke-width="1.6"/>
<text x="521" y="762" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">or set aside,</text>
<text x="521" y="780" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">for later</text>
<path d="M 487.4 908.8 A 310 310 0 0 1 368.9 826.6" class="flowd" stroke-width="2.0" marker-end="url(#ah)"/>
<text x="335" y="856" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">tasks I choose</text>
<text x="335" y="874" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">to hand over</text>
