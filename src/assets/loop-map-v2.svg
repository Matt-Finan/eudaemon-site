.flow{stroke:#E8E1D2}.flowd{stroke:#A9B0C0}
.rulec{stroke:#2A3550}.chipf{fill:#10182A}}
</style>
<defs><marker id="ah" markerWidth="8.5" markerHeight="8.5" refX="7" refY="4.25" orient="auto"><path d="M0,0 L8.5,4.25 L0,8.5 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1292" class="bg"/>
