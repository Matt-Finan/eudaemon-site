<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1292" viewBox="0 0 1200 1292" font-family="Georgia, 'Times New Roman', serif">
<style>
.bg{fill:#F1EBDF}.cardf{fill:#EDE6D6;stroke:#D8CFBB;stroke-width:1.4}
