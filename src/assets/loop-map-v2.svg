<text x="470" y="296" font-size="12.5" class="soft" text-anchor="end" font-style="italic">what actually happened</text>
<text x="470" y="314" font-size="12.5" class="soft" text-anchor="end" font-style="italic">returns as new records</text>
<rect x="490" y="265" width="220" height="90" rx="10" class="cardf"/>
