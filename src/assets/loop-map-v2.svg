<text x="600" y="96" font-size="16" class="ink" text-anchor="middle" letter-spacing="3">THE BOUNDARY</text>
<text x="600" y="118" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">the rules everything inside obeys</text>
<path d="M 600 1140 L 600 1166" class="flowd" stroke-width="1.6"/>
<rect x="270" y="1166" width="660" height="86" rx="10" class="cardf"/>
<text x="600" y="1204" font-size="15.5" class="ink" text-anchor="middle" letter-spacing="1.2">THE PLANT</text>
<text x="600" y="1228" font-size="12.5" class="soft" text-anchor="middle" font-style="italic">the machinery that keeps it all alive</text>
<text x="40" y="74" font-size="30" class="ink" text-anchor="start" letter-spacing="6">EUDAEMON</text>
<text x="40" y="102" font-size="14.5" class="soft" text-anchor="start" font-style="italic">eight blocks, one loop, me in the middle</text>
<text x="40" y="124" font-size="11.5" class="meta" text-anchor="start">the shape of the system · 09.08.2026</text>
<circle cx="954" cy="52" r="8" class="goldf"/>
<text x="954" y="56.2" font-size="9.5" class="dotn" text-anchor="middle" font-weight="bold">1</text>
