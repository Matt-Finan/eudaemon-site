<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 186" font-family="Newsreader, Georgia, 'Times New Roman', serif" role="img" aria-label="Twelve example days. Coffee cups mark coffee after 16:00, and they appear only on the five days shaded as overtime at work. The hours-asleep bars are short on exactly those days. Late coffee and poor sleep arrive together; the record shows the pattern and nothing more.">
  <style>
    .ink{stroke:#131C2E;fill:none;stroke-width:1.6}
    .hair{stroke:#131C2E;fill:none;stroke-width:1.2}
    .dash{stroke:#131C2E;fill:none;stroke-width:1.2;stroke-dasharray:3 4}
    .box{fill:#EDE6D6;stroke:#131C2E;stroke-width:1.5}
    .work{fill:#D5CAAE;stroke:none}
    .tink{fill:#131C2E;stroke:none}
    .bar{fill:#131C2E;stroke:none}
    .soft{fill:#4A5164;stroke:none}
    .meta{fill:#6B6450;stroke:none}
    .eno{fill:#7E6015;stroke:none}
    .gold{fill:#C99B3F;stroke:#131C2E;stroke-width:0.9}
    .garr{stroke:#C99B3F;fill:none;stroke-width:2}
    .coin{stroke:#7E6015;fill:none;stroke-width:1.6}
    .cointxt{fill:#7E6015;stroke:none}
    .ahf{fill:#131C2E;stroke:none}
    .gahf{fill:#C99B3F;stroke:none}
    @media (prefers-color-scheme: dark){
      .ink,.hair,.dash{stroke:#E8E1D2}
      .box{fill:#172138;stroke:#E8E1D2}
      .work{fill:#39466B}
      .tink{fill:#E8E1D2}
      .bar{fill:#E8E1D2}
      .soft{fill:#B8B2A2}
      .meta{fill:#8B8676}
      .eno{fill:#D9A441}
      .gold{fill:#D9A441;stroke:#0F1626}
      .garr{stroke:#D9A441}
      .coin{stroke:#D9A441}
      .cointxt{fill:#D9A441}
      .ahf{fill:#E8E1D2}
      .gahf{fill:#D9A441}
    }
  </style>
  <defs>
    <g id="cup">
      <rect x="-7" y="-4.5" width="13" height="9" rx="2" class="gold"/>
      <path d="M 6.5 -2 a 3 3 0 1 1 0 5" class="coin"/>
    </g>
  </defs>

  <rect x="323" y="42" width="240" height="102" rx="6" class="work"/>
  <text x="443" y="36" text-anchor="middle" font-size="10.5" font-style="italic" class="meta">overtime at work</text>

  <text x="132" y="76" text-anchor="end" font-size="10.5" class="soft">coffee after 16:00</text>
  <use href="#cup" x="351" y="72"/>
  <use href="#cup" x="397" y="72"/>
  <use href="#cup" x="443" y="72"/>
  <use href="#cup" x="489" y="72"/>
  <use href="#cup" x="535" y="72"/>

  <text x="132" y="118" text-anchor="end" font-size="10.5" class="soft">hours asleep</text>
  <g class="bar">
    <rect x="158" y="94" width="18" height="46" rx="2"/>
    <rect x="204" y="96" width="18" height="44" rx="2"/>
    <rect x="250" y="93" width="18" height="47" rx="2"/>
    <rect x="296" y="95" width="18" height="45" rx="2"/>
    <rect x="342" y="112" width="18" height="28" rx="2"/>
    <rect x="388" y="114" width="18" height="26" rx="2"/>
    <rect x="434" y="110" width="18" height="30" rx="2"/>
    <rect x="480" y="113" width="18" height="27" rx="2"/>
    <rect x="526" y="111" width="18" height="29" rx="2"/>
    <rect x="572" y="95" width="18" height="45" rx="2"/>
    <rect x="618" y="92" width="18" height="48" rx="2"/>
    <rect x="664" y="96" width="18" height="44" rx="2"/>
  </g>
  <line x1="150" y1="140.5" x2="693" y2="140.5" class="hair"/>
  <text x="167" y="154" text-anchor="middle" font-size="9.5" class="meta">day 1</text>
  <text x="673" y="154" text-anchor="middle" font-size="9.5" class="meta">day 12</text>

  <text x="420" y="176" text-anchor="middle" font-size="11" class="soft">late coffee and poor sleep arrive together; the record shows the pattern and nothing more</text>
</svg>
